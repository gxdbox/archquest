# ABSD 第 1 关：业务需求分析
# Architecture RPG 任务配置

level: 1
name: "业务需求分析"
description: "学习如何分析和理解业务需求，这是架构设计的第一步"
icon: "📋"
exp_reward: 100

background: |
  你刚刚加入了一家快速发展的电商公司，担任初级架构师。
  公司正在规划一个新的库存管理系统，CTO 老王决定让你负责需求分析工作。
  这是你证明自己的好机会！

stages:
  - stage: 1
    name: "需求收集"
    description: "学习如何从利益相关者那里收集需求"
    scenario: |
      老王把你叫到会议室："小伙子，我们要做一个库存管理系统。
      你先去和业务部门聊聊，了解他们的需求。记住，要问对问题！"
    
    key_points:
      - "识别利益相关者"
      - "使用开放式问题"
      - "记录功能性需求"
      - "发现隐含需求"
    
    hints:
      - "想想谁会使用这个系统？"
      - "他们最关心什么问题？"
      - "现有流程有什么痛点？"
    
    pass_score: 60

  - stage: 2
    name: "需求分析"
    description: "分析和整理收集到的需求"
    scenario: |
      你收集了一堆需求，老王看了看说："不错，但这些需求太乱了。
      你需要把它们分类整理，找出核心需求和次要需求。"
    
    key_points:
      - "需求分类（功能/非功能）"
      - "需求优先级排序"
      - "识别需求冲突"
      - "需求可行性分析"
    
    hints:
      - "哪些是必须有的功能？"
      - "哪些是锦上添花的？"
      - "有没有相互矛盾的需求？"
    
    pass_score: 60

  - stage: 3
    name: "需求文档"
    description: "编写清晰的需求规格说明"
    scenario: |
      老王满意地点点头："分析得不错！现在把这些需求写成文档，
      要让开发团队能看懂，也要让业务部门能确认。"
    
    key_points:
      - "需求描述清晰完整"
      - "使用用户故事格式"
      - "包含验收标准"
      - "需求可追溯性"
    
    hints:
      - "用 As a... I want... So that... 格式"
      - "每个需求都要有验收标准"
      - "需求之间的依赖关系要标明"
    
    pass_score: 60

completion_message: |
  恭喜你完成了第一关！你已经掌握了需求分析的基本技能。
  老王对你的表现很满意，决定让你继续挑战下一关：质量属性识别。

rewards:
  exp: 100
  skills:
    - name: "需求分析"
      level_up: 1
