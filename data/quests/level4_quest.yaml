# ABSD 第 4 关：架构评估（ATAM）
# Architecture RPG 任务配置

level: 4
name: "架构评估（ATAM）"
description: "使用 ATAM 方法评估架构设计"
icon: "🔍"
exp_reward: 250

background: |
  架构设计完成了，但在开始开发之前，需要评估架构是否满足需求。
  老王说："ATAM 是业界公认的架构评估方法，今天我教你怎么用。"

stages:
  - stage: 1
    name: "架构展示"
    description: "向评估团队展示架构设计"
    scenario: |
      老王召集了评估团队："首先，你要向大家展示你的架构设计。
      要清晰地说明架构决策和背后的理由。"
    
    key_points:
      - "架构视图（4+1视图）"
      - "关键架构决策"
      - "决策理由"
      - "约束和假设"
    
    hints:
      - "用图表辅助说明"
      - "解释为什么这样设计"
      - "说明有哪些权衡"
    
    pass_score: 60

  - stage: 2
    name: "敏感点和权衡点"
    description: "识别架构中的敏感点和权衡点"
    scenario: |
      老王说："敏感点是对质量属性影响大的决策，
      权衡点是影响多个质量属性的决策。找出它们！"
    
    key_points:
      - "敏感点识别"
      - "权衡点分析"
      - "质量属性影响"
      - "决策依赖关系"
    
    hints:
      - "哪些决策对性能影响最大？"
      - "哪些决策同时影响多个属性？"
      - "改变这个决策会有什么后果？"
    
    pass_score: 60

  - stage: 3
    name: "风险评估"
    description: "识别和评估架构风险"
    scenario: |
      老王严肃地说："最后一步，找出架构中的风险。
      哪些地方可能出问题？出了问题怎么办？"
    
    key_points:
      - "风险识别"
      - "风险影响评估"
      - "风险缓解策略"
      - "非风险确认"
    
    hints:
      - "技术风险有哪些？"
      - "业务风险有哪些？"
      - "如何降低这些风险？"
    
    pass_score: 60

completion_message: |
  🎉 恭喜你！你已经完成了 ABSD 四关的全部挑战！
  
  从一个初级架构师，你已经成长为能够独立完成架构设计的专业人士。
  老王拍着你的肩膀说："不错，小伙子，你有成为首席架构师的潜质！"
  
  但记住，这只是开始。真正的架构能力需要在实践中不断磨练。
  继续加油！

rewards:
  exp: 250
  skills:
    - name: "ATAM评估"
      level_up: 1
    - name: "风险管理"
      level_up: 1
  title: "中级架构师"
