# ABSD 第 2 关：质量属性识别
# Architecture RPG 任务配置

level: 2
name: "质量属性识别"
description: "学习如何识别和量化系统的质量属性需求"
icon: "⭐"
exp_reward: 150

background: |
  需求分析完成后，老王找到你说："功能需求只是冰山一角，
  真正决定架构的是质量属性。来，我教你怎么识别它们。"

stages:
  - stage: 1
    name: "质量属性识别"
    description: "识别系统需要满足的质量属性"
    scenario: |
      老王在白板上画了个图："库存系统要支持多少并发用户？
      响应时间要多快？系统挂了怎么办？这些都是质量属性。"
    
    key_points:
      - "性能（响应时间、吞吐量）"
      - "可用性（故障恢复时间）"
      - "可扩展性（用户增长）"
      - "安全性（数据保护）"
    
    hints:
      - "想想系统在高峰期的表现"
      - "如果服务器宕机会怎样？"
      - "敏感数据如何保护？"
    
    pass_score: 60

  - stage: 2
    name: "质量属性场景"
    description: "编写质量属性场景"
    scenario: |
      老王说："光说'系统要快'没用，要量化！
      用场景来描述：在什么情况下，系统要达到什么指标。"
    
    key_points:
      - "刺激源（谁/什么触发）"
      - "刺激（具体事件）"
      - "环境（正常/异常）"
      - "响应和度量"
    
    hints:
      - "格式：当[刺激]发生时，系统应该[响应]，在[时间]内完成"
      - "要有具体的数字指标"
      - "考虑正常和异常情况"
    
    pass_score: 60

  - stage: 3
    name: "质量属性优先级"
    description: "确定质量属性的优先级"
    scenario: |
      老王叹了口气："资源有限，不可能所有质量属性都做到极致。
      你要和业务方一起确定优先级，做出权衡。"
    
    key_points:
      - "业务价值评估"
      - "技术可行性"
      - "成本效益分析"
      - "风险评估"
    
    hints:
      - "哪些质量属性对业务最重要？"
      - "哪些实现成本最高？"
      - "如果某个属性达不到会怎样？"
    
    pass_score: 60

completion_message: |
  太棒了！你已经学会了如何识别和量化质量属性。
  这是架构设计中最关键的一步，很多架构师都在这里栽跟头。
  准备好进入下一关了吗？

rewards:
  exp: 150
  skills:
    - name: "质量属性"
      level_up: 1
