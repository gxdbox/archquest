# ABSD 第 3 关：架构风格与组件设计
# Architecture RPG 任务配置

level: 3
name: "架构风格与组件设计"
description: "选择合适的架构风格并设计系统组件"
icon: "🏛️"
exp_reward: 200

background: |
  有了需求和质量属性，现在是时候设计架构了。
  老王说："架构风格就像建筑风格，选对了事半功倍，选错了后患无穷。"

stages:
  - stage: 1
    name: "架构风格选择"
    description: "根据需求选择合适的架构风格"
    scenario: |
      老王问你："库存系统应该用什么架构风格？
      分层？微服务？事件驱动？每种都有优缺点，你要权衡。"
    
    key_points:
      - "理解各种架构风格特点"
      - "匹配质量属性需求"
      - "考虑团队技术栈"
      - "评估演进成本"
    
    hints:
      - "分层架构简单但扩展性有限"
      - "微服务灵活但复杂度高"
      - "事件驱动解耦但调试困难"
    
    pass_score: 60

  - stage: 2
    name: "组件识别"
    description: "识别系统的核心组件"
    scenario: |
      老王说："架构风格定了，现在要识别组件。
      记住：高内聚、低耦合，每个组件都要有明确的职责。"
    
    key_points:
      - "单一职责原则"
      - "组件边界划分"
      - "接口定义"
      - "依赖关系"
    
    hints:
      - "从业务领域出发划分组件"
      - "避免循环依赖"
      - "接口要稳定"
    
    pass_score: 60

  - stage: 3
    name: "组件交互设计"
    description: "设计组件之间的交互方式"
    scenario: |
      老王指着架构图："组件之间怎么通信？
      同步还是异步？用什么协议？这些都要想清楚。"
    
    key_points:
      - "同步 vs 异步通信"
      - "API 设计原则"
      - "消息队列使用"
      - "错误处理机制"
    
    hints:
      - "关键路径用同步，非关键用异步"
      - "API 要版本化"
      - "考虑失败重试机制"
    
    pass_score: 60

completion_message: |
  出色！你已经完成了架构设计的核心工作。
  但别高兴太早，架构设计完还要评估。
  最后一关：ATAM 架构评估，准备好了吗？

rewards:
  exp: 200
  skills:
    - name: "架构风格"
      level_up: 1
    - name: "组件设计"
      level_up: 1
